services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: brightpath
      POSTGRES_USER: brightpath
      POSTGRES_PASSWORD: brightpath
    ports:
      # 5433 on the host so it does not clash with a locally installed Postgres on 5432
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
