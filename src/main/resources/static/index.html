<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bright Path – Lịch học</title>
<style>
  :root {
    --bg: #f6f7f9; --surface: #fff; --text: #1d2330; --muted: #667085; --border: #e3e6eb;
    --accent: #2f6fde; --accent-text: #fff;
    --ok-bg: #e7f6ec; --ok: #1f7a3d;
    --warn-bg: #fff4e0; --warn: #9a5b00;
    --bad-bg: #fdecec; --bad: #b42318;
    --info-bg: #eaf1fd; --info: #2050a8;
    --gray-bg: #eef0f3; --gray: #555e6d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151b; --surface: #1b1f27; --text: #e6e8ec; --muted: #9aa3b2; --border: #2c323d;
      --accent: #5b8ff0; --accent-text: #0d1220;
      --ok-bg: #16301f; --ok: #6fd394;
      --warn-bg: #3a2a0f; --warn: #f5b950;
      --bad-bg: #3a1717; --bad: #f59a92;
      --info-bg: #172742; --info: #8fb4f5;
      --gray-bg: #262b34; --gray: #aab2bf;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 12px 16px;
           display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
  header h1 { font-size: 18px; margin: 0; }
  header .now { color: var(--muted); font-size: 13px; }
  main { max-width: 1100px; margin: 0 auto; padding: 16px; display: grid; gap: 16px;
         grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
  @media (max-width: 820px) { main { grid-template-columns: minmax(0, 1fr); } }
  section { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select, button, textarea { font: inherit; color: inherit; }
  input, select, textarea { width: 100%; padding: 7px 9px; border: 1px solid var(--border); border-radius: 6px;
                            background: var(--bg); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; }
  .row > div { flex: 1 1 140px; min-width: 0; }
  main > section { min-width: 0; }
  .field { margin-bottom: 10px; }
  button { padding: 7px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface);
           cursor: pointer; }
  button.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
  button.danger { color: var(--bad); }
  button:disabled { opacity: .5; cursor: default; }
  .summary { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; font-size: 13px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 600;
           background: var(--gray-bg); color: var(--gray); }
  .badge.booked { background: var(--ok-bg); color: var(--ok); }
  .badge.cancelled { background: var(--bad-bg); color: var(--bad); }
  .badge.rescheduled { background: var(--info-bg); color: var(--info); }
  .badge.no_show { background: var(--warn-bg); color: var(--warn); }
  .badge.alert { background: var(--warn-bg); color: var(--warn); }
  .banner { background: var(--warn-bg); color: var(--warn); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px;
            font-weight: 600; }
  .lessons { display: grid; gap: 10px; }
  .lesson { border: 1px solid var(--border); border-left: 4px solid var(--ok); border-radius: 8px; padding: 10px 12px; }
  .lesson.cancelled, .lesson.rescheduled { border-left-color: var(--muted); }
  .lesson.cancelled .time, .lesson.rescheduled .time { text-decoration: line-through; color: var(--muted); }
  .lesson.after-lock { border-left-color: var(--warn); background: color-mix(in srgb, var(--warn-bg) 45%, transparent); }
  .lesson .top { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .lesson .time { font-weight: 700; font-variant-numeric: tabular-nums; }
  .lesson .meta { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .lesson .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .lesson ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; color: var(--muted); }
  .inline-form { margin-top: 8px; padding: 10px; border-radius: 6px; background: var(--bg); }
  .msg { border-radius: 8px; padding: 10px 12px; margin-top: 12px; font-size: 14px; }
  .msg.ok { background: var(--ok-bg); color: var(--ok); }
  .msg.err { background: var(--bad-bg); color: var(--bad); }
  .empty { color: var(--muted); font-style: italic; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 4px; }
  .hidden { display: none; }
</style>
</head>
<body>
<header>
  <h1>Bright Path · Lịch học</h1>
  <span class="now" id="now">…</span>
</header>

<main>
  <section>
    <h2>Lịch của gia sư</h2>
    <div class="row">
      <div><label for="tutor">Gia sư</label><select id="tutor"></select></div>
      <div><label for="date">Ngày</label><input type="date" id="date"></div>
      <div style="flex:0 0 auto"><button id="reload">Tải lại</button></div>
    </div>
    <div class="summary" id="summary"></div>
    <div id="banner"></div>
    <div class="lessons" id="lessons"></div>
    <div id="dayMsg"></div>
  </section>

  <section>
    <h2>Đặt buổi học</h2>
    <form id="bookForm">
      <div class="field"><label for="bStudent">Học sinh</label><select id="bStudent" required></select></div>
      <div class="field"><label for="bTutor">Gia sư</label><select id="bTutor" required></select></div>
      <div class="row">
        <div class="field"><label for="bRoom">Phòng</label><select id="bRoom" required></select></div>
        <div class="field"><label for="bDuration">Thời lượng</label>
          <select id="bDuration"><option value="60">60 phút</option><option value="90">90 phút</option></select></div>
      </div>
      <div class="field"><label for="bStart">Bắt đầu</label><input type="datetime-local" id="bStart" step="900" required></div>
      <div class="field hidden" id="overrideField">
        <label for="bOverride">Lý do vượt luật</label>
        <input id="bOverride" placeholder="vd. gia đình chỉ đến được Thứ Hai, owner đã duyệt">
        <div class="hint">Chỉ cần cho luật mềm (Thứ Hai, quá 6 buổi/ngày). Trùng lịch thì không vượt được.</div>
      </div>
      <button class="primary" type="submit">Đặt buổi</button>
    </form>
    <div id="bookMsg"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const STATUS = { booked: 'Đã đặt', cancelled: 'Đã hủy', rescheduled: 'Đã dời', no_show: 'Vắng mặt' };
const CHANGE = { booked: 'Đặt', cancelled: 'Hủy', rescheduled: 'Dời đi', no_show: 'Vắng mặt' };
const RULES = {
  no_student_double_booking: 'Học sinh đã có buổi khác vào giờ này',
  no_tutor_double_booking: 'Gia sư đã có buổi khác vào giờ này',
  no_room_double_booking: 'Phòng đã có buổi khác vào giờ này',
  closed_on_monday: 'Trung tâm nghỉ Thứ Hai',
  max_6_lessons_per_tutor_per_day: 'Gia sư đã đủ 6 buổi trong ngày',
  booking_in_the_past: 'Không đặt được buổi trong quá khứ',
  lesson_duration_60_or_90: 'Buổi học chỉ 60 hoặc 90 phút',
  lesson_not_booked: 'Buổi này không còn ở trạng thái đã đặt',
  lesson_already_started: 'Buổi đã bắt đầu',
  lesson_not_started: 'Buổi chưa bắt đầu',
};
const SOFT_RULES = ['closed_on_monday', 'max_6_lessons_per_tutor_per_day'];

let ref = null;

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// The API always returns center time (+07:00), so the wall-clock part can be read straight from the string.
const hhmm = (iso) => iso.slice(11, 16);
const ddmm = (iso) => `${iso.slice(8, 10)}/${iso.slice(5, 7)}`;
const weekday = (isoDate) => ['CN', 'T2', 'T3', 'T4', 'T5', 'T6', 'T7'][new Date(isoDate.slice(0, 10) + 'T12:00').getDay()];

async function api(method, path, body) {
  const res = await fetch(path, {
    method, headers: body ? { 'Content-Type': 'application/json' } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = res.status === 204 ? null : await res.json().catch(() => null);
  if (!res.ok) throw Object.assign(new Error(data?.detail || res.statusText), { problem: data });
  return data;
}

function explain(err) {
  const p = err.problem;
  if (!p) return esc(err.message);
  let text = esc(RULES[p.rule] || p.detail);
  const refs = (p.details || []).filter((d) => d && d.lessonId).map((d) => esc(d.externalRef || '#' + d.lessonId));
  if (refs.length) text += ` (trùng với ${[...new Set(refs)].join(', ')})`;
  return text;
}

function showMsg(el, ok, html) {
  el.innerHTML = `<div class="msg ${ok ? 'ok' : 'err'}">${html}</div>`;
}

function fillSelect(el, items, value, label) {
  el.innerHTML = items.map((x) => `<option value="${esc(value(x))}">${esc(label(x))}</option>`).join('');
}

async function init() {
  ref = await api('GET', '/reference');
  $('now').textContent = `Bây giờ: ${weekday(ref.now)} ${ddmm(ref.now)} ${hhmm(ref.now)} (giả lập)`;
  fillSelect($('tutor'), ref.tutors, (t) => t.id, (t) => `${t.id} · ${t.name} (${t.subject})`);
  fillSelect($('bTutor'), ref.tutors, (t) => t.id, (t) => `${t.id} · ${t.name}`);
  fillSelect($('bRoom'), ref.rooms, (r) => r, (r) => r);
  fillSelect($('bStudent'), ref.students, (s) => s.id, (s) => s.fullName);
  // ?tutor=T1&date=2026-03-05 opens one tutor's day directly: the one link Mai sends instead of messages.
  const params = new URLSearchParams(location.search);
  if (ref.tutors.some((t) => t.id === params.get('tutor'))) $('tutor').value = params.get('tutor');
  $('date').value = /^\d{4}-\d{2}-\d{2}$/.test(params.get('date') || '') ? params.get('date') : ref.now.slice(0, 10);
  $('bStart').value = ref.now.slice(0, 10) + 'T16:00';
  $('tutor').addEventListener('change', loadDay);
  $('date').addEventListener('change', loadDay);
  $('reload').addEventListener('click', loadDay);
  $('bookForm').addEventListener('submit', book);
  await loadDay();
}

async function loadDay() {
  $('dayMsg').innerHTML = '';
  $('bTutor').value = $('tutor').value;
  history.replaceState(null, '', `?tutor=${encodeURIComponent($('tutor').value)}&date=${$('date').value}`);
  let day;
  try {
    day = await api('GET', `/tutors/${encodeURIComponent($('tutor').value)}/schedule?date=${$('date').value}`);
  } catch (e) {
    $('lessons').innerHTML = '';
    showMsg($('dayMsg'), false, explain(e));
    return;
  }
  const afterLock = new Set(day.changedAfterLock);
  $('summary').innerHTML = [
    `<span class="badge ${day.locked ? 'alert' : ''}">${day.locked ? 'Đã chốt' : 'Chưa chốt'} lúc ${hhmm(day.lockedAt)} ${ddmm(day.lockedAt)}</span>`,
    `<span class="badge">Bản #${day.revision}</span>`,
    `<span class="badge">${day.lessons.filter((l) => l.status === 'booked' || l.status === 'no_show').length} buổi giữ chỗ</span>`,
  ].join('');
  $('banner').innerHTML = afterLock.size
    ? `<div class="banner">⚠ ${afterLock.size} buổi đã thay đổi sau khi gửi lịch lúc 16:00, cần báo lại gia sư.</div>` : '';
  $('lessons').innerHTML = day.lessons.length
    ? day.lessons.map((l) => lessonCard(l, afterLock.has(l.lessonId))).join('')
    : '<p class="empty">Không có buổi nào.</p>';
}

function lessonCard(l, changedAfterLock) {
  const tags = [`<span class="badge ${l.status}">${STATUS[l.status] || l.status}</span>`];
  if (changedAfterLock) tags.push('<span class="badge alert">Đổi sau khi chốt</span>');
  if (l.status === 'cancelled') tags.push(`<span class="badge">${l.lateCancel ? 'Hủy muộn · tính phí' : 'Hủy sớm · miễn phí'}</span>`);
  if (l.legacyConflict) tags.push('<span class="badge alert">Trùng lịch cũ (từ sheet)</span>');
  const meta = [`Phòng ${esc(l.roomId)}`];
  if (l.externalRef) meta.push(esc(l.externalRef));
  if (l.replacesLessonId) meta.push(`dời từ buổi #${l.replacesLessonId}`);
  if (l.replacedByLessonId) meta.push(`→ dời sang ${weekday(l.replacedByStartsAt)} ${ddmm(l.replacedByStartsAt)} ${hhmm(l.replacedByStartsAt)} (buổi #${l.replacedByLessonId})`);
  const changes = l.changes.length
    ? `<ul>${l.changes.map((c) => `<li>${CHANGE[c.change] || c.change} lúc ${ddmm(c.changedAt)} ${hhmm(c.changedAt)}${c.afterLock ? ' · <strong>sau chốt</strong>' : ''}${c.reason ? ' · ' + esc(c.reason) : ''}</li>`).join('')}</ul>` : '';
  const actions = l.status === 'booked' ? `
    <div class="actions">
      <button class="danger" data-act="cancel" data-id="${l.lessonId}">Hủy</button>
      <button data-act="move" data-id="${l.lessonId}">Dời</button>
      <button data-act="noshow" data-id="${l.lessonId}">Vắng mặt</button>
    </div>
    <div class="inline-form hidden" id="move-${l.lessonId}">
      <div class="row">
        <div><label>Giờ mới</label><input type="datetime-local" step="900" class="mv-start" value="${l.startsAt.slice(0, 16)}"></div>
        <div><label>Phòng</label><select class="mv-room">${ref.rooms.map((r) => `<option ${r === l.roomId ? 'selected' : ''}>${esc(r)}</option>`).join('')}</select></div>
      </div>
      <div class="field" style="margin-top:8px"><label>Lý do</label><input class="mv-reason" placeholder="vd. lịch thi đổi"></div>
      <button class="primary" data-act="move-confirm" data-id="${l.lessonId}">Xác nhận dời</button>
    </div>` : '';
  return `<div class="lesson ${l.status} ${changedAfterLock ? 'after-lock' : ''}">
      <div class="top"><span class="time">${hhmm(l.startsAt)}–${hhmm(l.endsAt)}</span>
        <strong>${esc(l.studentName)}</strong>${tags.join('')}</div>
      <div class="meta">${meta.join(' · ')}</div>${changes}${actions}</div>`;
}

$('lessons').addEventListener('click', async (e) => {
  const btn = e.target.closest('button[data-act]');
  if (!btn) return;
  const id = btn.dataset.id;
  try {
    if (btn.dataset.act === 'cancel') {
      const reason = prompt('Lý do hủy (gia sư sẽ thấy):', 'gia đình hủy');
      if (reason === null) return;
      const l = await api('POST', `/lessons/${id}/cancel`, { reason });
      await loadDay();
      showMsg($('dayMsg'), true, `Đã hủy buổi #${id}. ${l.lateCancel ? 'Hủy trong vòng 4 tiếng: vẫn tính phí, gia sư vẫn được trả.' : 'Hủy trước hơn 4 tiếng: miễn phí.'} Phòng đã được nhả.`);
    } else if (btn.dataset.act === 'noshow') {
      if (!confirm('Đánh dấu học sinh vắng mặt? Buổi vẫn tính phí và giữ phòng.')) return;
      await api('POST', `/lessons/${id}/no-show`);
      await loadDay();
      showMsg($('dayMsg'), true, `Đã ghi vắng mặt cho buổi #${id}.`);
    } else if (btn.dataset.act === 'move') {
      $(`move-${id}`).classList.toggle('hidden');
    } else if (btn.dataset.act === 'move-confirm') {
      const box = $(`move-${id}`);
      const moved = await api('POST', `/lessons/${id}/reschedule`, {
        startsAt: box.querySelector('.mv-start').value,
        roomId: box.querySelector('.mv-room').value,
        reason: box.querySelector('.mv-reason').value || null,
      });
      await loadDay();
      showMsg($('dayMsg'), true, `Đã dời buổi #${id} sang ${ddmm(moved.startsAt)} ${hhmm(moved.startsAt)} (buổi mới #${moved.id}). Buổi cũ vẫn hiện để gia sư thấy.`);
    }
  } catch (err) {
    showMsg($('dayMsg'), false, explain(err));
  }
});

async function book(e) {
  e.preventDefault();
  const body = {
    studentId: Number($('bStudent').value),
    tutorId: $('bTutor').value,
    roomId: $('bRoom').value,
    startsAt: $('bStart').value,
    durationMin: Number($('bDuration').value),
    overrideReason: $('bOverride').value || null,
  };
  try {
    const l = await api('POST', '/lessons', body);
    showMsg($('bookMsg'), true, `Đã đặt buổi #${l.id}: ${weekday(l.startsAt)} ${ddmm(l.startsAt)} ${hhmm(l.startsAt)}–${hhmm(l.endsAt)}, phòng ${esc(l.roomId)}.`);
    $('overrideField').classList.add('hidden');
    $('bOverride').value = '';
    if ($('tutor').value === l.tutorId && $('date').value === l.startsAt.slice(0, 10)) await loadDay();
  } catch (err) {
    const soft = SOFT_RULES.includes(err.problem?.rule);
    if (soft) $('overrideField').classList.remove('hidden');
    showMsg($('bookMsg'), false, explain(err) + (soft ? '. Nhập lý do bên trên để đặt dù vậy.' : ''));
  }
}

init().catch((e) => showMsg($('dayMsg'), false, 'Không kết nối được API: ' + esc(e.message)));
</script>
</body>
</html>
