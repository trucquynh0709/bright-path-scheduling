spring:
  application:
    name: scheduling
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/brightpath}
    username: ${DB_USER:brightpath}
    password: ${DB_PASSWORD:brightpath}
  jpa:
    # Schema is owned by Flyway migrations, never by Hibernate
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  # 8080 is commonly taken on dev machines; override with PORT if needed
  port: ${PORT:8081}
